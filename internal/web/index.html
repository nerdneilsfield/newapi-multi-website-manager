  return async token=>{

    const gen=$('button',{className:token?'':'p',on:{click:async()=>{if(!token||confirm(t('tokRegenQ',{n:a.username})))call('POST')}}},t(token?'tokRegen':'tokGen'));
    if(!token)return $('div',{className:'row mid'},$('span',{className:'mute'},t('tokNone')),gen);

    const eye=$('button',{on:{click:()=>{shown=!shown;code.textContent=shown?token:'•'.repeat(12);eye.textContent=t(shown?'tokHide':'tokShowB');onToggle?.(shown)}}},t('tokShowB'));

    const base={mode:mode.value,amount:a,unit:unit.value};
    if(target.value==='group'){if(!val.value.trim())throw new Error(t('eGroup'));return{...base,group:val.value.trim()}}
    const ids=val.value.split(/[,\s]+/).filter(Boolean).map(Number);if(!ids.length||ids.some(n=>!Number.isInteger(n)||n<=0))throw new Error(t('eIds'));
    return{...base,user_ids:ids}}};
}
document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';document.title=t('app');
boot();
</script>
