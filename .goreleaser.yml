version: 2
env:
  - CGO_ENABLED=0

builds:
  -
    id: napm
    binary: napm
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/nerdneilsfield/newapi-multi-website-manager/internal/buildinfo.Version={{.Version}}
      - -X github.com/nerdneilsfield/newapi-multi-website-manager/internal/buildinfo.Commit={{.FullCommit}}
      - -X github.com/nerdneilsfield/newapi-multi-website-manager/internal/buildinfo.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  -
    ids:
      - napm
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  github:
    owner: nerdneilsfield
    name: newapi-multi-website-manager

dockers_v2:
  - id: napm
    dockerfile: Dockerfile.goreleaser
    ids:
      - napm
    images:
      - ghcr.io/nerdneilsfield/napm
    tags:
      - "{{ .Tag }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "io.artifacthub.package.readme-url": "https://raw.githubusercontent.com/nerdneilsfield/newapi-multi-website-manager/master/README.md"
      "io.artifacthub.package.maintainers": "[{\"name\":\"dengqqi\",\"email\":\"dengqqi935@gmail.com\"}]"
      "io.artifacthub.package.license": "MIT"
      "org.opencontainers.image.description": "Manage multiple new-api platforms: users, balances and scheduled quota updates."
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
    - '^test:'
    - '^chore'
    - 'merge conflict'
    - Merge pull request
    - Merge remote-tracking branch
    - Merge branch
    - go mod tidy
  groups:
    - title: Dependency updates
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: 'Documentation updates'
      regexp: ^.*?docs(\([[:word:]]+\))??!?:.+$
      order: 400
    - title: Other work
      order: 9999

# Publish to the nerdneilsfield/homebrew-apps tap and Scoop bucket.
homebrew_casks:
  - name: napm
    homepage: https://github.com/nerdneilsfield/newapi-multi-website-manager
    description: Manage multiple new-api sites from one web UI
    binaries:
      - napm
    directory: Casks
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/napm"]
          end

scoops:
  - name: napm
    homepage: https://github.com/nerdneilsfield/newapi-multi-website-manager
    description: Manage multiple new-api sites from one web UI
    license: MIT
    directory: bucket
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
